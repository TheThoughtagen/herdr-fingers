id = "thethoughtagen.herdr-fingers"
name = "Herdr Fingers"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Local, dependency-free, copy-only terminal hints"
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Copy visible token"
description = "Show letter hints over paths, URLs, and identifiers"
command = ["python3", "./fingers.py", "open"]

[[panes]]
id = "picker"
title = "Fingers"
placement = "overlay"
command = ["python3", "./fingers.py"]
